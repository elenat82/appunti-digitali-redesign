<aside class="sidebar" [class.sidebar--collapsed]="!isOpen()">
  <a class="sidebar-logo" routerLink="/" aria-label="Vai alla home">
    <img class="sidebar-logo-image" src="/assets/images/logo.svg" alt="">
  </a>

  <nav id="sidebar-navigation" aria-label="Argomenti">
    @for (area of areas(); track area.id) {
    <details #areaDetails [class.sidebar-area--active]="activeAreaId() === area.id">
      <summary class="sidebar-area-summary" [attr.aria-label]="isOpen() ? null : area.label"
        [attr.data-tooltip]="isOpen() ? null : area.label" (click)="openAreaIfCollapsed($event, areaDetails)">
        <img [src]="area.iconUrl" alt="" width="24" height="24">

        @if (isOpen()) {
        <span>{{ area.label }}</span>
        }
      </summary>

      @if (isOpen()) {
      <ul>
        @for (
        article of articlesByArea()[area.id] ?? [];
        track article.id
        ) {
        <li>
          <a [routerLink]="article.path">
            {{ article.title }}
          </a>
        </li>
        }
      </ul>
      }
    </details>
    }
  </nav>

  <button type="button" class="sidebar-toggle" aria-controls="sidebar-navigation" [attr.aria-expanded]="isOpen()"
    [attr.aria-label]="
      isOpen()
        ? 'Chiudi barra laterale'
        : 'Apri barra laterale'
    " (click)="toggle()" [attr.data-tooltip]="
    isOpen()
      ? 'Chiudi barra laterale'
      : 'Apri barra laterale'
  ">
    {{ isOpen() ? '‹' : '›' }}
  </button>
</aside>
