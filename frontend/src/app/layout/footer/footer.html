<footer class="app-footer">
  <div class="footer-left">
    <span>Made with</span>

    <span class="footer-tech" data-tooltip="Drupal">
      <i class="icon-app-drupal" aria-hidden="true"></i>

      <span class="visually-hidden">
        Drupal
      </span>
    </span>

    <span>+</span>

    <span class="footer-tech" data-tooltip="Angular">
      <i class="icon-app-angular" aria-hidden="true"></i>

      <span class="visually-hidden">
        Angular
      </span>
    </span>

    <span>+</span>

    <span class="footer-tech" data-tooltip="Love">
      <i class="icon-app-heart" aria-hidden="true"></i>

      <span class="visually-hidden">
        Love
      </span>
    </span>

    @if (email(); as email) {
    <span>by</span>

    <app-email-actions [email]="email" />
    }
  </div>

  <div class="footer-right">
    <app-privacy-actions />
  </div>
</footer>
