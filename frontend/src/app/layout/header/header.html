<header class="app-header">
  <a class="app-title" routerLink="/">
    Appunti Digitali
  </a>

  <app-search-bar />

  @if (
  search.query().trim() &&
  !search.isResultsOpen()
  ) {
  <button type="button" class="return-to-results" (click)="openResults()">
    <i class="icon-app-back-to-results" aria-hidden="true"></i> {{ resultsButtonLabel() }}
  </button>
  }
</header>
