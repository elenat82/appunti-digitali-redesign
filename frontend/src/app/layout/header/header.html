<header class="app-header">
  <a
    class="app-title"
    routerLink="/"
  >
    Appunti Digitali
  </a>

  <app-search-bar />

  @if (
    search.query().trim() &&
    !search.isResultsOpen()
  ) {
    <button
      type="button"
      class="return-to-results"
      (click)="search.openResults()"
    >
      Torna ai risultati
    </button>
  }
</header>
