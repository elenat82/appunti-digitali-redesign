appunti_digitali_integrations.stack_overflow:
  path: '/api/stackoverflow'
  defaults:
    _controller: '\Drupal\appunti_digitali_integrations\Controller\StackOverflowController::getQuestions'
  requirements:
    # Public endpoint consumed by the unauthenticated frontend.
    _access: 'TRUE'
  methods: [GET]

appunti_digitali_integrations.github:
  path: '/api/github/starred'
  defaults:
    _controller: '\Drupal\appunti_digitali_integrations\Controller\GitHubController::getStarredRepositories'
  requirements:
    # Public endpoint consumed by the unauthenticated frontend.
    _access: 'TRUE'
  methods: [GET]

appunti_digitali_integrations.news:
  path: '/api/news'
  defaults:
    _controller: '\Drupal\appunti_digitali_integrations\Controller\NewsController::getNews'
  requirements:
    # Public endpoint consumed by the unauthenticated frontend.
    _access: 'TRUE'
  methods: [GET]
