services:
  appunti_digitali_integrations.stack_overflow_client:
    class: Drupal\appunti_digitali_integrations\Service\StackOverflowClient
    arguments:
      - '@entity_type.manager'
      - '@http_client'
      - '@cache.default'

  appunti_digitali_integrations.github_client:
    class: Drupal\appunti_digitali_integrations\Service\GitHubClient
    arguments:
      - '@entity_type.manager'
      - '@http_client'
      - '@cache.default'

  appunti_digitali_integrations.news_service:
    class: Drupal\appunti_digitali_integrations\Service\NewsService
    arguments:
      - '@entity_type.manager'
